<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Page-list</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
    .custom-flex-fill {
        flex: 20 1 auto !important;
    }
</style>
<body class="d-flex flex-column min-vh-100">
<div class="d-flex flex-grow-1">
    <div class="sidebar bg-light" th:replace="FrontEndLayout::pSidebar"></div>

    <div class="custom-flex-fill">
        <div th:replace="FrontEndLayout::pHeader"></div>
        <div class="container py-4 pe-5">
            <h1 class="mb-4">Page edit</h1>
            <form th:action="@{/page/edit/{id}(id=${getIdEdit.id})}" th:object="${getIdEdit}" method="post">
                <div>
                    <label for="id">ID:</label>
                    <input type="text" id="id" th:field="*{id}" disabled />
                </div>

                <div>
                    <label for="name">Page Name:</label>
                    <input type="text" id="name" th:field="*{pageName}" required />
                </div>

                <div>
                    <label for="keyword">Keyword:</label>
                    <input type="text" id="keyword" th:field="*{keyword}" required />
                </div>

                <div>
                    <label for="content">Content:</label>
                    <input type="text" id="content" th:field="*{content}" required />
                </div>

                <div>
                    <label for="parentPageId">Parent page id:</label>
                    <input type="text" id="parentPageId" th:field="*{parentPageId}" required />
                </div>

                <div style="margin-top: 15px;">
                    <button type="submit">Save Changes</button>
                    <a href="/page/all">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="FrontEndLayout::pFooter"></div>
</body>
</html>
