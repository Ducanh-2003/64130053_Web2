<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Page-new</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
    .custom-flex-fill {
        flex: 20 1 auto !important;
    }
</style>
<body class="d-flex flex-column min-vh-100">
<div class="d-flex flex-grow-1">
    <div class="sidebar bg-light" th:replace="FrontEndLayout::pSidebar"></div>

    <div class="custom-flex-fill">
        <div th:replace="FrontEndLayout::pHeader"></div>
        <div class="container py-4 pe-5">
            <h1 class="mb-4">Page new</h1>
            <form th:action="@{/page/new}" th:object="${page}" method="post" class="container mt-4">
                <div class="mb-3">
                    <label for="id" class="form-label">ID:</label>
                    <input type="text" id="id" th:field="*{id}" class="form-control" required />
                </div>

                <div class="mb-3">
                    <label for="pageName" class="form-label">Page Name:</label>
                    <input type="text" id="pageName" th:field="*{pageName}" class="form-control" required />
                </div>

                <div class="mb-3">
                    <label for="keyword" class="form-label">Keyword:</label>
                    <input type="text" id="keyword" th:field="*{keyword}" class="form-control" required />
                </div>

                <div class="mb-3">
                    <label for="content" class="form-label">Content:</label>
                    <input type="text" id="content" th:field="*{content}" class="form-control" required />
                </div>

                <div class="mb-3">
                    <label for="parentPageId" class="form-label">Parent Page ID:</label>
                    <input type="text" id="parentPageId" th:field="*{parentPageId}" class="form-control" required />
                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-success">Save</button>
                    <a href="/page/all" class="btn btn-secondary ms-2">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="FrontEndLayout::pFooter"></div>
</body>
</html>
