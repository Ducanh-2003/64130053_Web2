<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</head>
<body>
    <div th:fragment="pContent">

        <nav class="navbar navbar-dark bg-dark w-100">
            <div class="container-fluid d-flex justify-content-center">
                <ul class="nav">
                    <li class="nav-item mx-5"><a class="nav-link text-white mx-3" th:href="@{/?page=home}">Home</a></li>
                    <li class="nav-item mx-5"><a class="nav-link text-white mx-3" th:href="@{/?page=about}">About</a></li>
                    <li class="nav-item mx-5"><a class="nav-link text-white mx-3" th:href="@{/?page=list}">List</a></li>
                    <li class="nav-item mx-5"><a class="nav-link text-white mx-3" th:href="@{/?page=add}">Add New</a></li>
                </ul>
            </div>
        </nav>

    <div class="row">
        <div class="col-8">
            <div class="container text-center mt-4">
                <div th:if="${page == 'home'}">
                    <h1>Home Page</h1>
                    <p>Welcome to the Home Page.</p>
                </div>

                <div th:if="${page == 'about'}">
                    <div th:replace="~{layout/About :: pAbout}"></div>
                </div>

                <div th:if="${page == 'list'}">
                    <div th:replace="~{layout/List :: pList}"></div>
                </div>

                <div th:if="${page == 'addNew'}">
                    <h1>Add New Page</h1>
                    <p>Form to add new item...</p>
                </div>
            </div>
        </div>

        <div class="col-4 d-flex justify-content-center align-items-center">
            <img src="https://thethaovanhoa.mediacdn.vn/372676912336973824/2022/12/16/avatar3-1671164179193908857633.jpg"
                 alt="Sidebar Image" class="img-thumbnail rounded shadow" style="max-width: 80%; height: 80%;">
        </div>
    </div>

    </div>
</body>
</html>
