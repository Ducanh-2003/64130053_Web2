<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="d-flex flex-column">
<div th:fragment="pContent">
    <nav class="navbar navbar-dark bg-dark w-100">
        <div class="container-fluid d-flex justify-content-center">
            <ul class="nav">
                <li class="nav-item"><a class="nav-link text-white mx-3" th:href="@{/?page=home}">Home</a></li>
                <li class="nav-item"><a class="nav-link text-white mx-3" th:href="@{/?page=about}">About</a></li>
                <li class="nav-item"><a class="nav-link text-white mx-3" th:href="@{/?page=list}">List</a></li>
                <li class="nav-item"><a class="nav-link text-white mx-3" th:href="@{/?page=add}">Add New</a></li>
            </ul>
        </div>
    </nav>
    <div class="container-fluid d-flex justify-content-center align-items-start ">
        <div class="row w-75">
            <div class="col-8 text-center mt-4">
                <div class="container text-center">
                    <div th:if="${page == 'home'}">
                        <div th:replace="~{layout/Home :: pHome}"></div>
                    </div>
                    <div th:if="${page == 'about'}">
                        <div th:replace="~{layout/About :: pAbout}"></div>
                    </div>
                    <div th:if="${page == 'list'}">
                        <div th:replace="~{layout/List :: pList}"></div>
                    </div>
                    <div th:if="${page == 'add'}">
                        <div th:replace="~{layout/AddNew :: pAddNew}"></div>
                    </div>
                </div>
            </div>

            <div class="col-4 d-flex justify-content-center align-items-center mt-5 mb-4">
                <img src="https://thethaovanhoa.mediacdn.vn/372676912336973824/2022/12/16/avatar3-1671164179193908857633.jpg"
                     alt="Sidebar Image" class="img-thumbnail rounded shadow" style="max-width: 80%; height: auto;">
            </div>
        </div>
    </div>
</div>
</body>
</html>
