<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin Sinh viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:fragment="pAbout" class="container d-flex justify-content-center align-items-center ">
    <div class=" p-4 w-50">
        <h2 class="text-center mb-4">Thông tin Sinh viên</h2>
        <div class="mb-3">
            <strong class="">Mã số sinh viên:</strong> <span th:text="${mssv}"></span>
        </div>
        <div class="mb-3">
            <strong class="">Họ tên:</strong> <span th:text="${hoVaTen}"></span>
        </div>
        <div class="mb-3">
            <strong class="">Năm sinh:</strong> <span th:text="${namSinh}"></span>
        </div>
        <div class="mb-3">
            <strong class="">Giới tính:</strong> <span th:text="${gioiTinh}"></span>
        </div>
    </div>
</div>
</body>
</html>
