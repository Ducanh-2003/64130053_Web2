<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Danh sách Sinh viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:fragment="pList" class="container mt-4">
    <h2 class="text-center mb-4">Danh sách Sinh viên</h2>

    <table class="table table-bordered table-striped table-hover">
        <thead class="table-dark text-center">
        <tr>
            <th>Mã sinh viên</th>
            <th>Họ và tên</th>
            <th>Điểm trung bình</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="student : ${studentModelList}">
            <td th:text="${student.stuId}" class="text-center"></td>
            <td th:text="${student.stuName}"></td>
            <td th:text="${student.stuGrade}" class="text-center"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
