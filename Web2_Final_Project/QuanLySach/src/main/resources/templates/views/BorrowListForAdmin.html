<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<div th:replace="fragments/header :: #header"></div>
<body>
<div th:replace="fragments/topbar :: #topbar"></div>
<div id="layoutSidenav">
    <div th:replace="fragments/sidebar :: #layoutSidenav_nav"></div>
    <div id="layoutSidenav_content">
        <main class="container-fluid px-4">
            <h2 class="mt-4">Quản lý mượn sách</h2>
            <div class="card mb-4 mt-3">
                <div class="card-body">
                    <table class="table table-bordered table-striped">
                        <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Người dùng</th>
                            <th>Sách</th>
                            <th>Ngày mượn</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="borrow : ${borrowPage}">
                            <td th:text="${borrow.id}"></td>
                            <td th:text="${borrow.user.name}"></td>
                            <td th:text="${borrow.book.title}"></td>
                            <td th:text="${borrow.borrowDate}"></td>
                            <td>
                                <span th:if="${borrow.status == 'pending'}">
                                    <a th:href="@{/borrows/approve/{id}(id=${borrow.id})}" class="btn btn-success btn-sm me-1">✅ Duyệt</a>
                                </span>
                                <span th:if="${borrow.status != 'pending'}">
                                    <span th:if="${borrow.status == 'approved'}" class="text-success fw-bold">Đã duyệt</span>
                                </span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <nav>
                        <ul class="pagination justify-content-center">

                            <li class="page-item" th:classappend="${borrowPage.first} ? 'disabled'">
                                <a class="page-link" th:href="@{/borrows/admin(page=${currentPage - 1}, size=${pageSize})}"><</a>
                            </li>

                            <li class="page-item" th:each="i : ${#numbers.sequence(0, borrowPage.totalPages - 1)}"
                                th:classappend="${i == currentPage} ? 'active'">
                                <a class="page-link" th:href="@{/borrows/admin(page=${i}, size=${pageSize})}" th:text="${i + 1}">1</a>
                            </li>

                            <li class="page-item" th:classappend="${borrowPage.last} ? 'disabled'">
                                <a class="page-link" th:href="@{/borrows/admin(page=${currentPage + 1}, size=${pageSize})}">></a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </main>

        <div th:replace="fragments/footer :: #footer"></div>
    </div>
</div>
</body>
</html>
