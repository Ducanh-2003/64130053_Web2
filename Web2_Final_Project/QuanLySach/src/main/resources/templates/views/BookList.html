<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<div th:replace="fragments/header :: #header"></div>
<body>
<div th:replace="fragments/topbar :: #topbar"></div>
<div id="layoutSidenav">
    <div th:replace="fragments/sidebar :: #layoutSidenav_nav"></div>
    <div id="layoutSidenav_content">
        <main class="container-fluid px-4">
            <h2 class="mt-4">List of Books</h2>
            <a class="btn btn-success my-3" th:href="@{/books/new}">➕ Create Book</a>
            <div class="card mb-4">
                <div class="card-body">
                    <table class="table table-bordered table-hover">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Author</th>
                            <th>Description</th>
                            <th>Quantity</th>
                            <th>Category</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="book : ${bookList}">
                            <td th:text="${book.id}"></td>
                            <td th:text="${book.title}"></td>
                            <td th:text="${book.author}"></td>
                            <td th:text="${book.description}"></td>
                            <td th:text="${book.quantity}"></td>
                            <td th:text="${book.categoryName}"></td>
                            <td>
                                <a class="btn btn-sm btn-info" th:href="@{/books/view/{id}(id=${book.id})}">👁 View</a>
                                <a class="btn btn-sm btn-warning" th:href="@{/books/edit/{id}(id=${book.id})}">✏️ Edit</a>
                                <a class="btn btn-sm btn-danger" th:href="@{/books/delete/{id}(id=${book.id})}"
                                   onclick="return confirm('Confirm delete?')">❌ Delete</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
        <div th:replace="fragments/footer :: #footer"></div>
    </div>
</div>
</body>
</html>
