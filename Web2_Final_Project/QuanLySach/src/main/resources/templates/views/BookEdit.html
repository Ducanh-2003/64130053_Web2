<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<div th:replace="fragments/header :: #header"></div>
<body>
<div th:replace="fragments/topbar :: #topbar"></div>
<div id="layoutSidenav">
    <div th:replace="fragments/sidebar :: #layoutSidenav_nav"></div>
    <div id="layoutSidenav_content">
        <main class="container-fluid px-4">
            <h2 class="mt-4">Edit Book</h2>
            <div class="card">
                <div class="card-body">
                    <form th:action="@{/books/edit/{id}(id=${bookEdit.id})}" th:object="${bookEdit}" method="post">
                        <div class="mb-3">
                            <label for="title" class="form-label">Title</label>
                            <input id="title" th:field="*{title}" type="text" class="form-control" required />
                        </div>

                        <div class="mb-3">
                            <label for="author" class="form-label">Author</label>
                            <input id="author" th:field="*{author}" type="text" class="form-control" required />
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea id="description" th:field="*{description}" class="form-control" rows="3"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="quantity" class="form-label">Quantity</label>
                            <input  id="quantity" th:field="*{quantity}" type="text" class="form-control" required />
                        </div>

                        <div class="mb-3">
                            <label for="category" class="form-label">Category</label>
                            <input id="category" th:field="*{categoryName}" type="text" class="form-control" required />
                        </div>

                        <div class="d-flex justify-content-center gap-2">
                            <button type="submit" class="btn btn-success">✅ Save</button>
                            <a class="btn btn-secondary" th:href="@{/books/all}">🔙 Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
        <div th:replace="fragments/footer :: #footer"></div>
    </div>
</div>
</body>
</html>
