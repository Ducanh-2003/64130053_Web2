<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<div th:replace="fragments/header :: #header"></div>
<body>
<div th:replace="fragments/topbar :: #topbar"></div>
<div id="layoutSidenav">
    <div th:replace="fragments/sidebar :: #layoutSidenav_nav"></div>
    <div id="layoutSidenav_content">
        <main class="container-fluid px-4">
            <h2 class="mt-4">Book Detail</h2>
            <div class="card mt-3">
                <div class="card-body">
                    <p><strong>Mã sách:</strong> <span th:text="${bookDetail.id}"></span></p>
                    <p><strong>Tiêu đề:</strong> <span th:text="${bookDetail.title}"></span></p>
                    <p><strong>Tác giả:</strong> <span th:text="${bookDetail.author}"></span></p>
                    <p><strong>Mô tả:</strong> <span th:text="${bookDetail.description}"></span></p>
                    <p><strong>Thể loại:</strong> <span th:text="${bookDetail.categoryName}"></span></p>
                    <p><strong>Đường dẫn sách:</strong> <span th:text="${bookDetail.bookLink}"></span></p>
                </div>
            </div>
            <div class="d-flex justify-content-center ">
                <a class="btn btn-secondary mt-3" th:href="@{/books/all}">🔙 Quay lại</a>
            </div>
        </main>
        <div th:replace="fragments/footer :: #footer"></div>
    </div>
</div>
</body>
</html>
