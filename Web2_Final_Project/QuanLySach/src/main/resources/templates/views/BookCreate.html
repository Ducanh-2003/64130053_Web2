<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<div th:replace="fragments/header :: #header"></div>
<body>
<div th:replace="fragments/topbar :: #topbar"></div>
<div id="layoutSidenav">
    <div th:replace="fragments/sidebar :: #layoutSidenav_nav"></div>
    <div id="layoutSidenav_content">
        <main class="container-fluid px-4">
            <h2 class="mt-4">Thêm mới sách</h2>
            <div class="card">
                <div class="card-body">
                    <form th:action="@{/books/new}" th:object="${book}" method="post">
                        <div class="mb-3">
                            <label for="title" class="form-label">Tiêu đề</label>
                            <input id="title" th:field="*{title}" type="text" class="form-control" required />
                        </div>

                        <div class="mb-3">
                            <label for="author" class="form-label">Tác giả</label>
                            <input id="author" th:field="*{author}" type="text" class="form-control" required />
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Mô tả</label>
                            <textarea id="description" th:field="*{description}" class="form-control" rows="3"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="category" class="form-label">Thể loại</label>
                            <input id="category" th:field="*{categoryName}" type="text" class="form-control" required />
                        </div>

                        <div class="mb-3">
                            <label for="link" class="form-label">Đường dẫn sách</label>
                            <input id="link" th:field="*{bookLink}" type="text" class="form-control" required />
                        </div>
                        <div class="d-flex justify-content-center gap-2">
                            <button type="submit" class="btn btn-success">✅ Tạo mới</button>
                            <a class="btn btn-secondary" th:href="@{/books/all}">🔙 Hủy</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
        <div th:replace="fragments/footer :: #footer"></div>
    </div>
</div>
</body>
</html>
