<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
</head>
<body>
<div class="container">
    <h2>BMI Calculator</h2>
    <form action="/bmi" method="post">
        <input type="text" name="weight" placeholder="Enter weight (kg)" required>
        <input type="text" name="height" placeholder="Enter height (m)" required>
        <button type="submit">Calculate BMI</button>
    </form>

    <div class="result">
        <p th:if="${result}" style="color: red;"><span th:text="${result}"></span></p>
        <p th:if="${resultBMI}">Your BMI: <span th:text="${resultBMI}"></span></p>
        <p th:if="${categoryBMI}">Category: <span th:text="${categoryBMI}"></span></p>
    </div>
</div>
</body>
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background-color: #f4f4f4;
        padding: 50px;
    }
    .container {
        background: #fff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        display: inline-block;
        max-width: 400px;
        width: 100%;
    }
    input {
        width: 94%;
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 5px;
    }
    button {
        padding: 10px 20px;
        background: #28a745;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }
    button:hover {
        background: #218838;
    }
    .result {
        margin-top: 20px;
        font-size: 1.2rem;
        color: #333;
    }
</style>
</html>
